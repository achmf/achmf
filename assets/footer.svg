<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 120" width="840" height="120" shape-rendering="crispEdges" role="img" aria-label="Game over - insert coin to continue"><style>@font-face{font-family:'P';src:url(data:font/woff2;base64,)}.blink{animation:b 1s steps(1) infinite}
@keyframes b{50%{opacity:0}}
.seg{animation:f .2s steps(1) both}
@keyframes f{from{opacity:0}}
.tw{animation:t 2.4s steps(2) infinite}
@keyframes t{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.blink,.tw,.seg{animation:none}}
text{font-family:'P',monospace}</style><rect width="840" height="120" fill="#0f0f1b"/><text x="420" y="55" font-size="28" fill="#ff3e88" text-anchor="middle">GAME OVER</text><text x="420" y="95" font-size="12" fill="#ffd23f" text-anchor="middle" class="blink">INSERT COIN TO CONTINUE</text></svg>